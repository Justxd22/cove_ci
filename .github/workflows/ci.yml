name: iOS IPA CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - ci/scratch

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: org.bitcoinppl.cove
      SCHEME: Cove
      PROJECT_PATH: ios/Cove.xcodeproj
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up just
        uses: extractions/setup-just@v1

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: rust/target
          key: rust-target-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/src/**') }}
          restore-keys: |
            rust-target-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-
            rust-target-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('ios/Cove.xcodeproj/project.pbxproj', 'ios/Cove/**/*.swift', 'ios/CoveCore/Package.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Decode and validate signing certificate
        run: |
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cove_cert.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/cove_cert.p12" -nokeys -passin pass:"$CERT_PASSWORD" >/dev/null
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}

      - name: Decode provisioning profile
        run: |
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/cove.mobileprovision"
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Configure keychain and profile
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import $RUNNER_TEMP/cove_cert.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/cove.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          PROFILE_PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i $RUNNER_TEMP/cove.mobileprovision > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Build Rust iOS core
        run: just build-ios-release

      - name: Archive app
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/Cove.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            clean archive

      - name: Create export options
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          EXPORT_PATH="$RUNNER_TEMP/ipa"
          echo "EXPORT_PATH=$EXPORT_PATH" >> $GITHUB_ENV
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cove-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
