name: iOS Unsigned IPA CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - ci/scratch

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: Cove
      PROJECT_PATH: ios/Cove.xcodeproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up just
        uses: extractions/setup-just@v1

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: rust/target
          key: rust-target-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/src/**') }}
          restore-keys: |
            rust-target-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-
            rust-target-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('ios/Cove.xcodeproj/project.pbxproj', 'ios/Cove/**/*.swift', 'ios/CoveCore/Package.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build Rust iOS core
        run: just build-ios-release

      - name: Build app for iphoneos without signing
        run: |
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Release-iphoneos/Cove.app"
          echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> $GITHUB_ENV
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app not found at $APP_PATH" >&2
            exit 1
          fi
          IPA_DIR="$RUNNER_TEMP/ipa"
          PAYLOAD_DIR="$IPA_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/Cove.app"
          (
            cd "$IPA_DIR"
            /usr/bin/zip -qry "Cove-unsigned.ipa" Payload
          )
          echo "IPA_OUTPUT=$IPA_DIR/Cove-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cove-unsigned-ipa
          path: ${{ env.IPA_OUTPUT }}
          if-no-files-found: error
